<!DOCTYPE html>
<html lang="en" style="background-color: #0A0A0A">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Makes the UA pick a canvas/scrollbar scheme before React mounts. The
         authoritative value still comes from the `.dark`/`.light` classes in
         globals.css, since the theme follows localStorage, not the OS. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Amarillo Abeja on light, Negro Colmena on dark: the browser chrome has
         to match the app surface in each mode or the toolbar looks detached. -->
    <meta name="theme-color" content="#FFC72C" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Beexa CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
